name: atomic_notes
# Note-content encryption is client-side and opt-in. When the user turns it on,
# each note's title/body/items are sealed with AES-256-GCM under a key derived
# on the device from a recovery phrase and the account id, so the same phrase
# opens the same notes on every device and the key never leaves the device.
# See lib/security/vault.dart. Transport is HTTPS; access control is enforced
# by the Atomic Notes API server (see lib/api/atomic_notes_api.dart) — this
# app no longer talks to Supabase directly, migrated to a custom Node.js
# backend with Google Drive as each user's note storage.
description: "A local-first notes app with cloud sync and optional end-to-end encryption."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.03.9+9

environment:
  # 3.6 is what bloc 9 and flutter_bloc 9 ask for; the build uses Flutter 3.44 (see the CI workflow).
  sdk: '>=3.6.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  # Backend transport — replaces supabase_flutter. google_sign_in drives the
  # native Google account picker; http talks to the Atomic Notes API server.
  http: ^1.2.2
  google_sign_in: ^6.2.2
  google_nav_bar: ^5.0.6
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.2.0
  flutter_svg: ^2.0.10+1
  # State management: bloc for the logic, flutter_bloc to put it on screen, equatable so a state
  # equal to the last one is dropped instead of rebuilding widgets. (provider was listed but never used.)
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  flutter_staggered_grid_view: ^0.7.0
  connectivity_plus: ^6.1.5
  smooth_page_indicator: ^1.1.0
  cupertino_icons: ^1.0.6
  local_auth: ^2.3.0

  # Client-side end-to-end encryption of note content.
  # cryptography: AES-256-GCM + Argon2id, pure Dart, actively maintained.
  # flutter_secure_storage: OS keychain/keystore for the unwrapped key at rest.
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2

  # Two-factor setup: the QR code an authenticator app scans.
  qr_flutter: ^4.1.0

  # Opens https links (notification buttons, the support page) in the phone's browser.
  url_launcher: ^6.3.2
  image_picker: ^1.2.4
  speech_to_text: ^7.5.0
  image: ^4.12.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  bloc_test: ^10.0.0
  # Moved out of `dependencies` — a lint ruleset is a build-time tool and has
  # no business shipping in the app's dependency graph.
  # Left on 3.x deliberately: flutter_lints 5.x needs Dart >= 3.5, above this
  # package's declared floor of 3.3.0. Bump both together when you're ready.
  flutter_lints: ^3.0.1

# Android resources are committed: builds never run an icon generator.
# The unchanged JPEG is the master artwork; Android packaging uses its supplied
# editable vector companion. tool/generate_android_branding.py is authoritative
# for the vector native splash, safe zones and committed resource library.
# This existing generator configuration is an optional raster fallback only.
# iOS and desktop/web scaffolds are not configured release targets.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/atomic-icon.jpg"
  image_path_android: "assets/new-atomic-icons/android/launcher-source-1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/new-atomic-icons/android/adaptive-foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/new-atomic-icons/android/adaptive-monochrome.png"

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  
  

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # NOTE: `- assets/` only includes files directly in assets/, not subfolders,
  # so the Atomic icon sets are listed explicitly.
  assets:
    - assets/Atomic Notes Mascot/022 Antimatter/
    - assets/Atomic Notes Mascot/038 Ollie/
    - assets/Atomic Notes Mascot/040 Vaulty/
    - assets/Atomic Notes Mascot/047 Rocco/
    - assets/Atomic Notes Mascot/049 Sat/
    - assets/Atomic Notes Mascot/051 Blink/
    - assets/Atomic Notes Mascot/052 Tilde/
    - assets/Atomic Notes Mascot/058 Commit/
    - assets/Atomic Notes Mascot/061 Cubie/
    - assets/Atomic Notes Mascot/062 Atomblock/
    - assets/Atomic Notes Mascot/066 Hoot/
    - assets/Atomic Notes Mascot/073 Lappy/
    - assets/Atomic Notes Mascot/076 Pocket/
    - assets/
    - assets/new-atomic-icons/png/atomic-icon-on-light.png
    - assets/new-atomic-icons/png/atomic-icon-on-dark.png
    - assets/new-atomic-icons/gif/atomic-spin-on-light.gif
    - assets/new-atomic-icons/gif/atomic-spin-on-dark.gif
    - assets/atomic-splash/atomic-spin-on-light-static.png
    - assets/atomic-splash/atomic-spin-on-dark-static.png
    - assets/Atomic Icons/atom-formation.gif
    - assets/Atomic Icons/atom-to-coin.gif
    - assets/Atomic Icons/atomic-notes-orbit.gif
    - assets/Atomic Icons/Icons-With-label/
    - assets/Atomic Icons/Icons-Without-label/
    - assets/Atomic Icons/Icons-Without-label-2.5D/
    - assets/Avatars/men/
    - assets/Avatars/women/

  # Technical Editorial type system. Bundled rather than pulled at runtime via
  # google_fonts: this is a local-first app that must render correctly with no
  # network, and bundling keeps the rendering deterministic.
  fonts:
    # Display / headings — condensed, uppercase, authoritative.
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
          weight: 400
    # Body / narrative.
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700
    # Metadata / labels / stats — the "dev" voice.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
