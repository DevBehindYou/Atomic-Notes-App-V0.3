<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="tachyonCore" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#d0d0ff" />
      <stop offset="100%" stop-color="#6b6bff" />
    </radialGradient>
    <filter id="shadowT" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glowT">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Light Cone / Barrier Rings -->
  <ellipse cx="100" cy="100" rx="85" ry="30" fill="none" stroke="#2e2eff" stroke-width="3" transform="rotate(35 100 100)" filter="url(#glowT)" opacity="0.7"/>
  <ellipse cx="100" cy="100" rx="65" ry="20" fill="none" stroke="#a0a0ff" stroke-width="2" transform="rotate(35 100 100)" filter="url(#glowT)" opacity="0.5"/>
  
  <!-- Tachyon Particle (Elongated) -->
  <ellipse cx="100" cy="100" rx="35" ry="15" fill="url(#tachyonCore)" transform="rotate(35 100 100)" filter="url(#shadowT)"/>
  <ellipse cx="100" cy="100" rx="35" ry="15" fill="none" stroke="#ffffff" stroke-width="2" transform="rotate(35 100 100)" filter="url(#glowT)" opacity="0.9"/>
</svg>