<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="strangeCore" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a0a0ff" />
      <stop offset="50%" stop-color="#2e2eff" />
      <stop offset="100%" stop-color="#0000cc" />
    </radialGradient>
    <radialGradient id="ordinaryMatter" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4a4a4a" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </radialGradient>
    <filter id="shadowS" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Orbit ring representing the conversion field -->
  <ellipse cx="100" cy="100" rx="75" ry="35" fill="none" stroke="#2e2eff" stroke-width="2" transform="rotate(-15 100 100)" opacity="0.5"/>
  
  <!-- Ordinary matter spheres -->
  <circle cx="50" cy="75" r="16" fill="url(#ordinaryMatter)" filter="url(#shadowS)"/>
  <circle cx="145" cy="130" r="14" fill="url(#ordinaryMatter)" filter="url(#shadowS)"/>
  
  <!-- Sphere currently converting to strange matter -->
  <circle cx="145" cy="65" r="18" fill="url(#strangeCore)" filter="url(#shadowS)"/>
  
  <!-- Central Strangelet Core -->
  <circle cx="100" cy="100" r="35" fill="url(#strangeCore)" filter="url(#shadowS)"/>
  <circle cx="100" cy="100" r="35" fill="none" stroke="#a0a0ff" stroke-width="2" opacity="0.6"/>
</svg>