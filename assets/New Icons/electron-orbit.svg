<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreSphere" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4a4a4a" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </radialGradient>
    <radialGradient id="electronSphere" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6b6bff" />
      <stop offset="100%" stop-color="#2e2eff" />
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="#f4f4f4"/>
  <!-- Orbit Ring (Back half) -->
  <ellipse cx="100" cy="100" rx="75" ry="30" fill="none" stroke="#2e2eff" stroke-width="4" transform="rotate(-20 100 100)" opacity="0.5"/>
  <!-- Core Black Sphere -->
  <circle cx="100" cy="100" r="35" fill="url(#coreSphere)" />
  <!-- Orbit Ring (Front half) -->
  <path d="M 30 100 A 75 30 0 0 0 170 100" fill="none" stroke="#2e2eff" stroke-width="4" transform="rotate(-20 100 100)" />
  <!-- Electron with Shadow -->
  <circle cx="65" cy="55" r="14" fill="url(#electronSphere)" />
</svg>