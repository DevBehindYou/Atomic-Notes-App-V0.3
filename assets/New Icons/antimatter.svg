<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="matter" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a0a0ff" />
      <stop offset="100%" stop-color="#2e2eff" />
    </radialGradient>
    <radialGradient id="antimatter" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#666" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </radialGradient>
    <filter id="shadowA" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glowA">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Annihilation Glow -->
  <circle cx="100" cy="100" r="35" fill="#a0a0ff" filter="url(#glowA)" opacity="0.6"/>
  
  <!-- Matter Sphere -->
  <circle cx="75" cy="100" r="45" fill="url(#matter)" filter="url(#shadowA)"/>
  
  <!-- Antimatter Sphere -->
  <circle cx="125" cy="100" r="45" fill="url(#antimatter)" filter="url(#shadowA)"/>
  
  <!-- Starburst / Energy Release -->
  <path d="M 100 50 L 106 85 L 140 80 L 115 100 L 140 120 L 106 115 L 100 150 L 94 115 L 60 120 L 85 100 L 60 80 L 94 85 Z" fill="#ffffff" filter="url(#glowA)" opacity="0.95"/>
</svg>