<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="innerShadow">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="#f4f4f4"/>
  <!-- Outer Ring with Drop Shadow -->
  <circle cx="100" cy="100" r="60" fill="#222222" filter="url(#outerShadow)" />
  <!-- Inner Hole (Carved out) -->
  <circle cx="100" cy="100" r="40" fill="#f4f4f4" filter="url(#innerShadow)" />
</svg>