<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueDisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b6bff" />
      <stop offset="100%" stop-color="#2e2eff" />
    </linearGradient>
    <filter id="shadowMinus" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <filter id="innerShadowMinus">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="#f4f4f4"/>
  <!-- Base Button -->
  <circle cx="100" cy="100" r="60" fill="url(#blueDisc)" filter="url(#shadowMinus)" />
  <!-- Carved Minus Groove -->
  <rect x="75" y="94" width="50" height="12" rx="6" fill="#1a1aff" filter="url(#innerShadowMinus)" />
  <rect x="75" y="94" width="50" height="4" rx="2" fill="#00004d" />
</svg>