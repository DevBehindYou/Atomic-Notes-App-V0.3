name: Flutter verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-feasibility:
    name: Guarded WebApp compile feasibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Prepare locked non-production configuration
        run: |
          cp lib/authentication/auth_services/cred.example.dart lib/authentication/auth_services/cred.dart
          flutter pub get --enforce-lockfile
          echo "CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Verify bounded proof parser
        run: python3 -m unittest discover -s tool -p 'test_web_compile_proof.py'
      - name: Compile actual main and verify browser startup guard
        env:
          ATOMIC_WEB_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tool/run_web_compile_proof.py
      - name: Upload sanitized compile and gate outcomes only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-web-compile-proof
          path: ci-web-compile-proof.json
          if-no-files-found: error
          retention-days: 1

  server-wire:
    name: Disposable App to Server contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout verified Server fixture
        uses: actions/checkout@v5
        with:
          repository: DevBehindYou/Atomic-Notes-Server-V0.3
          ref: 5f4e941139b28ffa06b205b72b9c2937821198c9
          path: server-fixture
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server-fixture/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve locked non-production dependencies
        run: |
          cp lib/authentication/auth_services/cred.example.dart lib/authentication/auth_services/cred.dart
          flutter pub get --enforce-lockfile
          npm ci --prefix server-fixture
      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --name atomic-wire-mongo -p 127.0.0.1:27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec atomic-wire-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' > /dev/null; then break; fi
            sleep 2
          done
          docker exec atomic-wire-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})' > /dev/null
          for attempt in {1..30}; do
            if docker exec atomic-wire-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify real wire contract and owned namespace cleanup
        run: python3 tool/run_server_wire_fixture.py
      - name: Verify opt-in logout wire contract and per-case cleanup
        run: python3 tool/run_logout_wire_fixture.py
      - name: Verify read-only recovery inspection and owned cleanup
        run: python3 tool/run_logout_recovery_wire_fixture.py
      - name: Verify explicit same-owner logout recovery and owned cleanup
        run: python3 tool/run_logout_handoff_wire_fixture.py
      - name: Verify user sign-in APIs and retained Hive work
        run: python3 tool/run_user_sessions_wire_fixture.py
      - name: Upload sanitized user sign-in wire outcomes
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-user-sessions-server-wire-proof
          path: ci-user-sessions-server-wire-proof.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload sanitized wire outcomes
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-server-wire-proof
          path: ci-wire-proof.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload sanitized logout wire outcomes
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-logout-server-wire-proof
          path: ci-logout-server-wire-proof.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload sanitized recovery inspection outcome
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-logout-recovery-server-wire-proof
          path: ci-logout-recovery-server-wire-proof.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload sanitized same-owner recovery outcomes
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-logout-handoff-server-wire-proof
          path: ci-logout-handoff-server-wire-proof.json
          if-no-files-found: warn
          retention-days: 1
      - name: Remove owned disposable MongoDB container
        if: always()
        run: |
          if docker inspect atomic-wire-mongo > /dev/null 2>&1; then
            docker rm -f atomic-wire-mongo > /dev/null
          fi

  flutter:
    name: Flutter analyze, tests, and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Matches the SDK baseline documented in android/settings.gradle.
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Prepare non-production configuration and logs
        run: |
          mkdir -p ci-logs
          cp lib/authentication/auth_services/cred.example.dart lib/authentication/auth_services/cred.dart
          flutter --version | tee ci-logs/flutter-version.txt

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile | tee ci-logs/pub-get.log

      - name: Verify pinned mascot catalog and default assets
        run: dart run tool/verify_mascot_catalog.dart

      - name: Analyze (errors, warnings, and infos are fatal)
        id: analyze
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos 2>&1 | tee ci-logs/analyze.log

      - name: Verify notes home and editor behavior
        env:
          ATOMIC_REPAIR_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ATOMIC_UI_CAPTURE: 'true'
        run: python3 tool/run_notes_ui_fixture.py

      - name: Upload bounded notes UI outcomes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-notes-ui-proof
          path: ci-notes-ui-proof.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload synthetic notes UI previews
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: synthetic-notes-ui-previews
          path: ci-notes-ui-previews/*.png
          if-no-files-found: warn
          retention-days: 1

      - name: Record redacted changed-source diagnostics for repair
        if: always()
        env:
          ATOMIC_REPAIR_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tool/run_logout_source_diagnostics.py

      - name: Upload redacted changed-source diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-logout-source-diagnostics
          path: ci-logout-source-diagnostics.json
          if-no-files-found: warn
          retention-days: 1

      - name: Verify committed Android branding assets
        run: |
          python3 tool/test_verify_branding_assets.py
          python3 tool/verify_branding_assets.py --proof ci-branding-assets-proof.json

      - name: Upload sanitized Android branding outcomes
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-branding-assets-proof
          path: ci-branding-assets-proof.json
          if-no-files-found: warn
          retention-days: 1

      - name: Verify controlled Cloud Notes automatic activity
        run: python3 tool/run_cloud_activity_fixture.py

      - name: Upload sanitized Cloud Notes activity outcomes
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-cloud-activity-proof
          path: ci-cloud-activity-proof.json
          if-no-files-found: warn
          retention-days: 1

      - name: Verify controlled live mascot status
        run: |
          python3 -m unittest discover -s tool -p 'test_run_mascot_status_fixture.py'
          python3 tool/run_mascot_status_fixture.py

      - name: Upload sanitized mascot status outcomes
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-mascot-status-proof
          path: ci-mascot-status-proof.json
          if-no-files-found: warn
          retention-days: 1

      - name: Verify historical and current R2 logout preservation
        run: |
          git fetch --no-tags --depth=1 origin 2cdc0516935b0ae9b8d7770efcf0d66ae1b8b55a
          python3 tool/test_run_r2_causal_fixture.py
          python3 tool/run_r2_causal_fixture.py

      - name: Upload sanitized R2 causal outcomes
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-r2-causal-proof
          path: ci-r2-causal-proof.json
          if-no-files-found: warn
          retention-days: 1

      - name: Verify controlled user sign-in ownership and safe retry
        run: |
          python3 tool/test_run_user_sessions_fixture.py
          python3 tool/run_user_sessions_fixture.py

      - name: Upload sanitized user sign-in outcomes
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-user-sessions-proof
          path: ci-user-sessions-proof.json
          if-no-files-found: warn
          retention-days: 1

      - name: Verify native full-batch push acknowledgement preservation
        env:
          ATOMIC_PUSH_ACK_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tool/test_run_push_ack_proof.py
          python3 tool/run_push_ack_proof.py

      - name: Upload sanitized native push acknowledgement outcomes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-push-ack-proof
          path: ci-push-ack-proof.json
          if-no-files-found: error
          retention-days: 1

      - name: Run existing tests
        id: tests
        run: flutter test --no-pub --reporter expanded 2>&1 | tee ci-logs/test.log

      - name: Verify controlled logout recovery with fixed outcome codes
        if: always()
        env:
          ATOMIC_REPAIR_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tool/run_logout_recovery_controls.py

      - name: Upload redacted controlled-recovery machine diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-logout-machine-diagnostics
          path: ci-logout-machine-diagnostics.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload sanitized logout recovery controls
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-logout-recovery-controls-proof
          path: ci-logout-recovery-controls-proof.json
          if-no-files-found: warn
          retention-days: 1

      - name: Build verification APK
        id: build
        run: flutter build apk --debug --no-pub 2>&1 | tee ci-logs/build-apk.log

      - name: Upload compiler evidence and resolved dependencies
        id: diagnostics
        if: always()
        # Console logs remain available even when artifact storage is full.
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: flutter-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/
            pubspec.lock
          if-no-files-found: warn
          retention-days: 1

      - name: Report unavailable diagnostic artifact
        if: always() && steps.diagnostics.outcome == 'failure'
        run: |
          echo '::warning::Diagnostic artifact upload failed. Read the step logs above for compiler output and the upload error. If storage quota is exhausted, remove obsolete GitHub Actions artifacts before rerunning.'
          echo 'Diagnostic artifact upload failed; compiler output remains in the workflow step logs. APK upload is still required for a successful build job.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-production debug APK
        id: apk-upload
        uses: actions/upload-artifact@v6
        with:
          name: atomic-notes-verification-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Record bounded Flutter verification outcomes
        if: always()
        env:
          ATOMIC_VERIFY_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ATOMIC_VERIFY_ANALYZE: ${{ steps.analyze.outcome }}
          ATOMIC_VERIFY_TESTS: ${{ steps.tests.outcome }}
          ATOMIC_VERIFY_BUILD: ${{ steps.build.outcome }}
          ATOMIC_VERIFY_APKUPLOAD: ${{ steps.apk-upload.outcome }}
        run: python3 tool/record_flutter_verification.py

      - name: Upload bounded Flutter verification proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-flutter-verification-proof
          path: ci-flutter-verification-proof.json
          if-no-files-found: error
          retention-days: 1
