name: Deploy showcase site (GitHub Pages)

# Publishes the marketing / showcase one-pager in `docs/` to GitHub Pages.
#
# ONE-TIME SETUP (repo owner, in the GitHub UI):
#   Settings → Pages → Build and deployment → Source → "GitHub Actions".
#   That is it. No branch to pick, this workflow does the rest.
#
# This workflow uploads only docs/. Flutter analysis, tests and APK creation
# run separately in flutter-ci.yml and do not require GitHub Pages.

# Optimization repository: publish only when the owner explicitly requests it.
on:
  workflow_dispatch:

# Least privilege: read the repo, write to Pages, mint the deploy token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight Pages deploy; just queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy docs/
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify Pages setup
        uses: actions/github-script@v8
        with:
          script: |
            const settings = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/settings/pages`;
            try {
              const { data } = await github.rest.repos.getPages(context.repo);
              if (data.build_type !== 'workflow') {
                core.setFailed(`Set Pages > Build and deployment > Source to GitHub Actions: ${settings}`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              const message = `GitHub Pages is not available for this repository/token. Enable Pages and select GitHub Actions at ${settings}. Check repository plan eligibility if Pages is unavailable. This setting is not needed for the Flutter verification workflow.`;
              await core.summary.addHeading('Pages setup required').addRaw(message).write();
              core.setFailed(message);
            }

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
