name: Signed Android release

# Manual only. Builds release APKs signed with YOUR upload/release key and
# stores them as a workflow artifact. It does not publish anything: download the
# artifact and attach the files to a GitHub Release yourself.
#
# Required repository SECRETS (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
# Required repository VARIABLES (public values, not secrets):
#   API_BASE_URL               e.g. https://atomic-notes-server-gde2e.vercel.app/api
#   GOOGLE_SERVER_CLIENT_ID    the Server's WEB OAuth client ID (same as its GOOGLE_CLIENT_ID)
# See CI.md for how to create the key and register its SHA-1 with Google.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Analyze, test, and build signed APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check signing secrets and public settings
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$KEYSTORE_BASE64" ] || fail "Secret ANDROID_KEYSTORE_BASE64 is not set. This workflow never falls back to the debug key."
          [ -n "$KEYSTORE_PASSWORD" ] || fail "Secret ANDROID_KEYSTORE_PASSWORD is not set."
          [ -n "$KEY_ALIAS" ] || fail "Secret ANDROID_KEY_ALIAS is not set."
          [ -n "$KEY_PASSWORD" ] || fail "Secret ANDROID_KEY_PASSWORD is not set."
          case "$API_BASE_URL" in https://*/api) ;; *) fail "Variable API_BASE_URL must start with https:// and end with /api." ;; esac
          case "$GOOGLE_SERVER_CLIENT_ID" in
            YOUR_*|'') fail "Variable GOOGLE_SERVER_CLIENT_ID is not set to the real Web OAuth client ID." ;;
            *.apps.googleusercontent.com) ;;
            *) fail "Variable GOOGLE_SERVER_CLIENT_ID must end with .apps.googleusercontent.com." ;;
          esac

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Matches the SDK baseline documented in android/settings.gradle.
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Prepare configuration
        run: |
          cp lib/authentication/auth_services/cred.example.dart lib/authentication/auth_services/cred.dart
          flutter pub get

      - name: Analyze (errors, warnings, and infos are fatal)
        run: flutter analyze --no-pub --fatal-warnings --fatal-infos

      - name: Run tests
        run: flutter test --no-pub

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed release APKs
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          # The version exactly as pubspec.yaml writes it (for example 2.03.4+7), passed explicitly so the
          # APK's versionName keeps that form and the versionCode is the build number.
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r' | head -1)"
          case "$VERSION" in
            *+*) ;;
            *) echo "::error::pubspec.yaml version must look like 2.03.4+7 (name+build), got '$VERSION'."; exit 1 ;;
          esac
          flutter build apk --release --split-per-abi --no-pub \
            --build-name="${VERSION%%+*}" --build-number="${VERSION##*+}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Verify signature and record fingerprints
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          cd build/app/outputs/flutter-apk
          test -n "$(ls app-*-release.apk 2>/dev/null)" || { echo "::error::No release APKs were produced."; exit 1; }
          {
            echo "## Signed release APKs"
            echo
            for apk in app-*-release.apk; do
              # The exit status is the signature check. Output is kept whole so any failure is readable.
              if ! "$APKSIGNER" verify -v --print-certs "$apk" > "$RUNNER_TEMP/certs.txt" 2>&1; then
                cat "$RUNNER_TEMP/certs.txt"
                echo "::error::apksigner does not accept the signature of $apk."
                exit 1
              fi
              if grep -qi "Android Debug" "$RUNNER_TEMP/certs.txt"; then
                echo "::error::$apk is signed with the Android debug key. Refusing to publish it."
                exit 1
              fi
              # Without a readable certificate the debug-key check above proves nothing: stop and show why.
              if ! grep -qi "certificate" "$RUNNER_TEMP/certs.txt"; then
                cat "$RUNNER_TEMP/certs.txt"
                echo "::error::Could not read the signing certificate of $apk from apksigner's output."
                exit 1
              fi
              echo "### $apk"
              echo '```'
              # Informational only: if the format differs, print the raw output instead of failing.
              grep -E "^Verified using|Signer #1 certificate (DN|SHA-256|SHA-1)" "$RUNNER_TEMP/certs.txt" || cat "$RUNNER_TEMP/certs.txt"
              sha256sum "$apk"
              # Package, versionCode and versionName as Android will read them.
              "$AAPT" dump badging "$apk" | head -1 || true
              echo '```'
            done
            echo "Register the certificate **SHA-1** above in the Google Cloud **Android** OAuth client for package \`com.notes.atomic\`."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties

      - name: Upload signed APKs
        uses: actions/upload-artifact@v6
        with:
          name: atomic-notes-signed-release-${{ github.run_id }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 14
