name: Browser storage boundary proof

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-storage-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-storage:
    name: Owned Chromium Hive commit and abort proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve locked non-production dependencies
        run: |
          cp lib/authentication/auth_services/cred.example.dart lib/authentication/auth_services/cred.dart
          flutter pub get --enforce-lockfile
          echo "CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Verify bounded proof parser controls
        run: |
          python3 -m unittest discover -s tool -p 'test_web_storage_proof.py'
          python3 -m unittest discover -s tool -p 'test_browser_record_proof.py'
          python3 -m unittest discover -s tool -p 'test_browser_owner_proof.py'
          python3 -m unittest discover -s tool -p 'test_browser_preimage_proof.py'
      - name: Observe real Hive browser commit and late abort boundaries
        env:
          ATOMIC_WEB_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tool/run_web_storage_proof.py
      - name: Upload fixed outcomes only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-web-storage-proof
          path: ci-web-storage-proof.json
          if-no-files-found: error
          retention-days: 1
      - name: Checkout fixed pure Server envelope authority
        uses: actions/checkout@v5
        with:
          repository: DevBehindYou/Atomic-Notes-Server-V0.3
          ref: 95070c0cff488e4984bd669d31bfdf348ec74aca
          path: server-fixture
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server-fixture/package-lock.json
      - name: Resolve locked pure Server proof dependencies
        run: npm ci --prefix server-fixture
      - name: Verify bounded shared envelope proof controls
        run: python3 -m unittest discover -s tool -p 'test_sync_envelope_proof.py'
      - name: Prove pure shared envelope with actual Server VM and owned Chrome
        env:
          ATOMIC_WEB_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tool/run_sync_envelope_proof.py
      - name: Upload fixed shared envelope outcomes only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-sync-envelope-proof
          path: ci-sync-envelope-proof.json
          if-no-files-found: error
          retention-days: 1
      - name: Prove inactive native record commit and failure boundaries
        env:
          ATOMIC_WEB_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tool/run_browser_record_proof.py
      - name: Upload fixed inactive record outcomes only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-browser-record-proof
          path: ci-browser-record-proof.json
          if-no-files-found: error
          retention-days: 1
      - name: Prove inactive owner context checks in native transactions
        env:
          ATOMIC_WEB_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tool/run_browser_owner_proof.py
      - name: Upload fixed inactive owner outcomes only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-browser-owner-proof
          path: ci-browser-owner-proof.json
          if-no-files-found: error
          retention-days: 1
      - name: Prove inactive exact record preimages in native transactions
        env:
          ATOMIC_WEB_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tool/run_browser_preimage_proof.py
      - name: Upload fixed inactive preimage outcomes only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-browser-preimage-proof
          path: ci-browser-preimage-proof.json
          if-no-files-found: error
          retention-days: 1
